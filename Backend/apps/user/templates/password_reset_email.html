<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecimiento de Contraseña</title>
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #f7d000; color:#fff; margin:0; height:100vh; display:flex; justify-content:center; align-items:center;">
    <div style="width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #000; border-radius: 10px; box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);">
        <h2 style="color: #f7d000;">Solicitud de Restablecimiento de Contraseña</h2>
        <p>Hola {{ user.username }},</p>
        <p>Has solicitado restablecer tu contraseña. Haz clic en el siguiente botón para cambiarla:</p>
        <p><a href="{{ reset_link }}" style="display: inline-block; padding: 10px 20px; margin-top: 20px; background-color: #f7d000; color: #000; text-decoration: none; border-radius: 5px;">Restablecer Contraseña</a></p>
        <p>Si no solicitaste este cambio, puedes ignorar este correo.</p>
        <p style="margin-top: 20px; font-size: 12px; color: #f7d000;">Gracias,<br>El equipo del sistema</p>
    </div>
</body>
</html>
