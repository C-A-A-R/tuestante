<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establecer Nueva Contraseña | TuEstante</title>
    <link rel="icon" href="../../assets/icons/favicon.ico">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">
    <div class="auth-bg-split"><div class="left"></div><div class="right"></div></div>
    <div class="auth-bg-decoration"><div class="glow-sphere glow-1"></div><div class="glow-sphere glow-2"></div></div>
    <main class="auth-page-container">
        <section class="auth-card">
            <header class="auth-header">
                <a href="../../index.html" class="auth-logo-link" title="Ir al Inicio"><img class="auth-logo-img" src="../../assets/images/logo.svg" alt="TuEstante Logo"></a>
                <h1 class="auth-title">Nueva contraseña</h1>
                <p class="auth-subtitle">Crea una contraseña segura para volver a acceder a tu cuenta.</p>
            </header>
            <div id="authErrorNotification" class="auth-notification" style="display: none;" role="alert"><span id="authErrorText"></span></div>
            <div id="authSuccessNotification" class="auth-notification auth-notification-success" style="display: none;" role="status"><span id="authSuccessText"></span></div>
            <form class="auth-form" id="set-new-password-form" novalidate>
                <div class="form-group">
                    <label for="new_password" class="form-label">Nueva Contraseña</label>
                    <div class="input-wrapper"><span class="input-icon" aria-hidden="true">*</span><input type="password" id="new_password" name="new_password" class="form-input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password"></div>
                    <span class="field-error-message" id="new_passwordError"></span>
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
                    <div class="input-wrapper"><span class="input-icon" aria-hidden="true">*</span><input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repite la contraseña" required autocomplete="new-password"></div>
                    <span class="field-error-message" id="confirm_passwordError"></span>
                </div>
                <button type="submit" class="btn-auth-submit" id="submit-new-password"><span class="btn-text">Guardar contraseña</span><span class="btn-spinner" style="display: none;">Guardando...</span></button>
                <div class="auth-footer-links"><a href="login.html" class="back-home-link">Volver a iniciar sesión</a></div>
            </form>
        </section>
    </main>
    <script type="module" src="confirm_password_change.js"></script>
</body>
</html>
