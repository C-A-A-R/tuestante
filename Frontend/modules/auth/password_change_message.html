<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado | TuEstante</title>
    <link rel="icon" href="../../assets/icons/favicon.ico">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">
    <div class="auth-bg-split"><div class="left"></div><div class="right"></div></div>
    <div class="auth-bg-decoration"><div class="glow-sphere glow-1"></div><div class="glow-sphere glow-2"></div></div>
    <main class="auth-page-container">
        <section class="auth-card">
            <header class="auth-header">
                <a href="../../index.html" class="auth-logo-link" title="Ir al Inicio"><img class="auth-logo-img" src="../../assets/images/logo.png" alt="TuEstante Logo"></a>
                <div class="auth-success-icon" aria-hidden="true">✓</div>
                <h1 class="auth-title">Revisa tu correo</h1>
                <p class="auth-subtitle">Te enviamos un enlace para restablecer la contraseña de tu cuenta.</p>
            </header>
            <div class="auth-info-box">Si no encuentras el mensaje en unos minutos, revisa la carpeta de spam o correo no deseado.</div>
            <div class="auth-footer-links"><a href="login.html" class="btn-auth-submit">Volver a iniciar sesión</a></div>
        </section>
    </main>
</body>
</html>
