<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | TuEstante</title>
    <meta name="description" content="Inicia sesión en TuEstante para gestionar tus pedidos y compras de mobiliario metálico.">
    <link rel="icon" href="../../assets/icons/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos Base y de Login -->
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-body">
    <div class="auth-bg-split"><div class="left"></div><div class="right"></div></div>
    <!-- Fondo Decorativo -->
    <div class="auth-bg-decoration">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="auth-page-container">
        <!-- Tarjeta de Login -->
        <div class="auth-card">
            <div class="auth-header">
                <a href="../../index.html" class="auth-logo-link" title="Ir al Inicio">
                    <img class="auth-logo-img" src="../../assets/images/logo.png" alt="TuEstante Logo" onerror="this.style.display='none'">
                </a>
                <h1 class="auth-title">Iniciar Sesión</h1>
                <p class="auth-subtitle">Ingresa a tu cuenta para continuar con tu compra o gestionar tus pedidos en TuEstante.</p>
            </div>

            <!-- Notificación de Error Global -->
            <div id="authErrorNotification" class="auth-notification" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="authErrorText">Error al iniciar sesión</span>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
                <!-- Campo Correo -->
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" class="form-input" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>
                    <span class="field-error-message" id="emailError"></span>
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <a href="password_change_form.html" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="contrasena" name="contrasena" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Mostrar u ocultar contraseña">
                            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error-message" id="contrasenaError"></span>
                </div>

                <!-- Botón Iniciar Sesión -->
                <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-auth-submit">
                    <span class="btn-text">Iniciar Sesión</span>
                    <div class="btn-spinner" style="display: none;">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="2" x2="12" y2="6"></line>
                            <line x1="12" y1="18" x2="12" y2="22"></line>
                            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                            <line x1="2" y1="12" x2="6" y2="12"></line>
                            <line x1="18" y1="12" x2="22" y2="12"></line>
                            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                        </svg>
                    </div>
                </button>

                <!-- Pie del Formulario / Volver -->
                <div class="auth-footer-links">
                    <div class="register-redirect-text" style="font-size: 0.88rem; margin-bottom: 6px; color: var(--body-text);">
                        ¿No tienes una cuenta? <a href="register.html" class="forgot-password-link" style="font-weight: 700;">Regístrate</a>
                    </div>
                    <a href="../../index.html" class="back-home-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Volver a la Tienda
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>

</html>
