<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | TuEstante</title>
    <link rel="icon" href="../../assets/icons/favicon.ico">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">
    <div class="auth-bg-split"><div class="left"></div><div class="right"></div></div>
    <div class="auth-bg-decoration"><div class="glow-sphere glow-1"></div><div class="glow-sphere glow-2"></div></div>
    <main class="auth-page-container">
        <section class="auth-card">
            <header class="auth-header">
                <a href="../../index.html" class="auth-logo-link" title="Ir al Inicio"><img class="auth-logo-img" src="../../assets/images/logo.svg" alt="TuEstante Logo"></a>
                <h1 class="auth-title">Recuperar contraseña</h1>
                <p class="auth-subtitle">Ingresa el correo de tu cuenta y te enviaremos un enlace para restablecerla.</p>
            </header>
            <div id="authErrorNotification" class="auth-notification" style="display: none;" role="alert"><span id="authErrorText"></span></div>
            <form class="auth-form" id="password-reset-request-form" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <div class="input-wrapper"><span class="input-icon" aria-hidden="true">@</span><input type="email" id="email" name="email" class="form-input" placeholder="ejemplo@correo.com" required autocomplete="email"></div>
                    <span class="field-error-message" id="emailError"></span>
                </div>
                <button type="submit" class="btn-auth-submit" id="passwordResetSubmitBtn"><span class="btn-text">Enviar enlace</span><span class="btn-spinner" style="display: none;">Enviando...</span></button>
                <div class="auth-footer-links"><a href="login.html" class="back-home-link">Volver a iniciar sesión</a></div>
            </form>
        </section>
    </main>
    <script type="module" src="password_change_form.js"></script>
</body>
</html>
