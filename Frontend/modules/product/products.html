<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - TuEstante</title>
    <meta name="description"
        content="Explora el catálogo completo de productos de TuEstante: Lockers, Estantes Industriales, Armarios y Mobiliario Metálico de alta durabilidad en Venezuela.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">

    <!-- Estilos Globales y de Componentes -->
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../components/navbar/navbar.css">
    <link rel="stylesheet" href="../../components/footer/footer.css">
    <link rel="stylesheet" href="../../components/product-cart/product-cart.css">
    <link rel="stylesheet" href="products.css">
</head>

<body>
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <!-- 1. Encabezado / Carrusel de Tipos de Producto -->
        <section class="product-types-hero-section">
            <div class="product-types-carousel-container" id="types-carousel">
                <div class="types-carousel-slides-wrapper" id="types-slides-wrapper">
                    <!-- Slides cargadas dinámicamente -->
                </div>

                <!-- Botones de Navegación -->
                <button class="types-carousel-arrow prev" id="types-prev-btn" aria-label="Tipo de producto anterior">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="types-carousel-arrow next" id="types-next-btn" aria-label="Siguiente tipo de producto">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

                <!-- Puntos Indicadores -->
                <div class="types-carousel-dots" id="types-carousel-dots"></div>
            </div>
        </section>

        <!-- 2. Barra de Filtros del Catálogo -->
        <section class="products-toolbar-section">
            <div class="filter-card-container">
                <!-- 1. Buscador por Nombre -->
                <div class="filter-group filter-search-group">
                    <label for="search-input" class="filter-field-label">Buscador por Nombre</label>
                    <div class="filter-input-wrapper">
                        <svg class="filter-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" class="filter-text-input" placeholder="Escribe el nombre del producto..." aria-label="Buscar por nombre del producto">
                        <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Limpiar buscador" title="Borrar búsqueda" style="display: none;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 2. Tipo de Producto -->
                <div class="filter-group">
                    <label for="filter-type" class="filter-field-label">Tipo de Producto</label>
                    <div class="filter-select-wrapper">
                        <select id="filter-type" class="filter-select" aria-label="Filtrar por tipo de producto">
                            <option value="all">Todos los Tipos</option>
                        </select>
                    </div>
                </div>

                <!-- 3. Disponibilidad / Outlet -->
                <div class="filter-group">
                    <label for="filter-outlet" class="filter-field-label">Disponibilidad / Outlet</label>
                    <div class="filter-select-wrapper">
                        <select id="filter-outlet" class="filter-select" aria-label="Filtrar por productos outlet">
                            <option value="all">Todos los Productos</option>
                            <option value="outlet">⚡ Solo Outlet / Liquidación</option>
                            <option value="regular">📦 Catálogo Estándar</option>
                        </select>
                    </div>
                </div>

                <!-- 4. Destacados / Más Deseados -->
                <div class="filter-group">
                    <label for="filter-featured" class="filter-field-label">Destacados</label>
                    <div class="filter-select-wrapper">
                        <select id="filter-featured" class="filter-select" aria-label="Filtrar productos destacados o más deseados">
                            <option value="all">Todos los Productos</option>
                            <option value="featured">⭐ Más Deseados (Destacados)</option>
                        </select>
                    </div>
                </div>

                <!-- 5. Ordenar Por -->
                <div class="filter-group">
                    <label for="filter-sort" class="filter-field-label">Ordenar Por</label>
                    <div class="filter-select-wrapper">
                        <select id="filter-sort" class="filter-select" aria-label="Ordenar catálogo de productos">
                            <option value="default">Más Recientes</option>
                            <option value="price-asc">Precio: Menor a Mayor</option>
                            <option value="price-desc">Precio: Mayor a Menor</option>
                            <option value="popular">Más Populares (Favoritos)</option>
                            <option value="name-asc">Nombre: A - Z</option>
                        </select>
                    </div>
                </div>

                <!-- 6. Botón Limpiar Filtros -->
                <div class="filter-action-group">
                    <button type="button" id="clear-filters-btn" class="btn-clear-filters" title="Limpiar todos los filtros">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l6.73-6.19"></path>
                        </svg>
                        <span>Limpiar Filtros</span>
                    </button>
                </div>
            </div>

            <!-- Estado de Resultados y Filtros Activos -->
            <div class="filter-status-row" id="filter-status-row">
                <span class="filter-results-badge" id="filter-results-badge">Cargando catálogo...</span>
                <div class="active-filter-chips" id="active-filter-chips"></div>
            </div>
        </section>

        <!-- 4. Listado Unificado de Productos (Grid de 4 Columnas sin Cajas ni Títulos) -->
        <section class="products-catalog-section">
            <div class="unified-products-grid" id="products-catalog-container">
                <!-- Renderizado dinámico de tarjetas mezcladas -->
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Script principal de la pantalla -->
    <script type="module" src="products.js"></script>
</body>

</html>
