<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - TuEstante</title>
    <meta name="description"
        content="Explora el catálogo completo de productos de TuEstante: Lockers, Estantes Industriales, Armarios y Mobiliario Metálico de alta durabilidad en Venezuela.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">

    <!-- Estilos Globales y de Componentes -->
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="../../components/navbar/navbar.css">
    <link rel="stylesheet" href="../../components/footer/footer.css">
    <link rel="stylesheet" href="products.css">
</head>

<body>
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <!-- 1. Encabezado / Carrusel de Tipos de Producto -->
        <section class="product-types-hero-section">
            <div class="product-types-carousel-container" id="types-carousel">
                <div class="types-carousel-slides-wrapper" id="types-slides-wrapper">
                    <!-- Slides cargadas dinámicamente -->
                </div>

                <!-- Botones de Navegación -->
                <button class="types-carousel-arrow prev" id="types-prev-btn" aria-label="Tipo de producto anterior">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="types-carousel-arrow next" id="types-next-btn" aria-label="Siguiente tipo de producto">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

                <!-- Puntos Indicadores -->
                <div class="types-carousel-dots" id="types-carousel-dots"></div>
            </div>
        </section>

        <!-- 2. Barra de Control de Catálogo Ultra Elegante -->
        <section class="products-toolbar-section">
            <div class="toolbar-container">
                <div class="products-count-badge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Catálogo Completo (<span id="products-count-number">0</span> productos)
                </div>
                
                <div class="sort-box-wrapper">
                    <span class="sort-icon-bg">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="11" y1="5" x2="21" y2="5"></line>
                            <line x1="11" y1="12" x2="21" y2="12"></line>
                            <line x1="11" y1="19" x2="21" y2="19"></line>
                            <polyline points="3 8 6 5 9 8"></polyline>
                            <line x1="6" y1="5" x2="6" y2="19"></line>
                        </svg>
                    </span>
                    <div class="sort-content">
                        <label for="sort-select" class="sort-label">Ordenar por:</label>
                        <select id="sort-select" class="sort-select">
                            <option value="date-desc">Lo Más Reciente</option>
                            <option value="price-asc">Precio: Menor a Mayor</option>
                            <option value="price-desc">Precio: Mayor a Menor</option>
                            <option value="name-asc">Nombre: A - Z</option>
                            <option value="featured">Destacados Primero</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. Listado Unificado de Productos (Grid de 4 Columnas sin Cajas ni Títulos) -->
        <section class="products-catalog-section">
            <div class="unified-products-grid" id="products-catalog-container">
                <!-- Renderizado dinámico de tarjetas mezcladas -->
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Script principal de la pantalla -->
    <script type="module" src="products.js"></script>
</body>

</html>
