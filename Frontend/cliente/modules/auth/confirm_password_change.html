<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establecer Nueva Contraseña | Diego's Grill</title>
    <link rel="stylesheet" href="confirmar_cambio_contraseña.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="confirmar_cambio_contraseña.js"></script>
</head>
<body>
    <div class="header-container"></div>

    <div class="container">
        <div class="card">
            <div class="logo-corner">
                <img src="../images/logo 3.png" alt="Diego's Grill">
            </div>
            <div class="header">
                <h1 class="title">Nueva Contraseña</h1>
                <p class="subtitle">Ingresa una contraseña segura y confírmala para finalizar.</p>
            </div>
            <form class="form" id="set-new-password-form" novalidate>
                <div class="form-row" style="grid-template-columns:1fr 1fr;">
                    <div class="input-group">
                        <label for="new_password" class="input-label">Nueva Contraseña</label>
                        <div class="password-container">
                            <input type="password" id="new_password" name="new_password" class="input-field" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" id="toggle-new-password">
                                <img class="password-icon" src="../images/open.png" alt="Mostrar contraseña">
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirm_password" class="input-label">Confirmar Contraseña</label>
                        <div class="password-container">
                            <input type="password" id="confirm_password" name="confirm_password" class="input-field" placeholder="Repite la contraseña" required>
                            <button type="button" class="toggle-password" id="toggle-confirm-password">
                                <img class="password-icon" src="../images/open.png" alt="Mostrar contraseña">
                            </button>
                        </div>
                    </div>
                </div>
                <div class="button-group" style="justify-content:center;">
                    <button type="submit" class="send-button" id="submit-new-password">Guardar y continuar</button>
                </div>
                <div id="form-bottom-message" class="form-bottom-message" aria-live="polite"></div>
            </form>
        </div>
    </div>
</body>
</html>
