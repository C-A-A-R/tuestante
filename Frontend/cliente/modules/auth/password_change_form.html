<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Diego's Grill</title>
    <link rel="stylesheet" href="formulario_cambio_contraseña.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- <script src="registro.js"></script> -->
</head>
<body>
    <div class="header-container"></div>

    <div class="container">
        <div class="card">
            <div class="logo-corner">
                <img src="../images/logo 3.png" alt="Diego's Grill">
            </div>
            <div class="header">
                <h1 class="title">Recuperar contraseña</h1>
                <p class="subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
            </div>
            <form class="form" id="password-reset-request-form">
                <div class="form-row" style="grid-template-columns:1fr;">
                    <div class="input-group full-width">
                        <label for="email" class="input-label">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="input-field" placeholder="tu@email.com" required>
                    </div>
                </div>
                <div class="button-group" style="justify-content:center;">
                    <button type="submit" class="send-button">Enviar enlace</button>
                </div>
                <div id="form-bottom-message" class="form-bottom-message" aria-live="polite"></div>
            </form>
        </div>
    </div>
</body>
</html>
