<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Colaboradores | TuEstante</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpeg" />

  <!-- Estilos Globales y de Componentes -->
  <link rel="stylesheet" href="variables.css?v=2.1" />
  <link rel="stylesheet" href="index.css?v=2.1" />
  <link rel="stylesheet" href="components/navbar/navbar.css?v=2.1" />
  <link rel="stylesheet" href="components/footer/footer.css?v=2.1" />
  <link rel="stylesheet" href="components/product-card/product-card.css?v=2.1" />
  <link rel="stylesheet" href="components/category-sidebar/category-sidebar.css?v=2.1" />
  <link rel="stylesheet" href="components/dialog/dialog.css?v=2.2" />
</head>
<body>

  <!-- Placeholder Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Contenedor Principal: Layout de dos columnas (Sidebar 25% / Grid 75%) -->
  <main class="container">
    <div class="catalog-layout">
      
      <!-- Columna Izquierda (25%): CategorySidebar -->
      <div id="sidebar-container">
        <!-- Renderizado dinámico de CategorySidebar.js -->
      </div>

      <!-- Columna Derecha (75%): Dashboard y Grid de Productos -->
      <section class="catalog-main-content" aria-label="Catálogo de Productos">
        
        <!-- Encabezado del Catálogo -->
        <div class="catalog-header">
          <div class="catalog-title-group">
            <h1>Catálogo de Consumo Interno</h1>
            <p id="catalog-subtitle">Explora artículos con cargo directo a tu nómina quincenal sin intereses.</p>
          </div>

          <div class="catalog-controls">
            <!-- Botón Toggle Filtros en Móvil -->
            <button type="button" class="btn-mobile-filter-toggle" id="btn-toggle-mobile-filters">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
              </svg>
              <span>Mostrar Filtros</span>
            </button>
          </div>
        </div>

        <!-- Grid de Productos -->
        <div class="products-grid" id="products-grid">
          <!-- Skeleton Loaders Iniciales -->
          <div class="skeleton-card">
            <div class="skeleton skeleton-image"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text-short"></div>
            <div class="skeleton skeleton-button"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton skeleton-image"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text-short"></div>
            <div class="skeleton skeleton-button"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton skeleton-image"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text-short"></div>
            <div class="skeleton skeleton-button"></div>
          </div>
        </div>

        <!-- Vista Vacía cuando no hay coincidencias -->
        <div class="empty-state" id="catalog-empty-state" style="display: none;">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <h3>No se encontraron productos</h3>
          <p>No hay artículos que coincidan con los filtros o el término de búsqueda actual.</p>
          <button type="button" class="btn btn-primary" id="btn-reset-catalog-filters">
            Restablecer Filtros
          </button>
        </div>

      </section>
    </div>
  </main>

  <!-- Placeholder Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script type="module" src="index.js"></script>
</body>
</html>
