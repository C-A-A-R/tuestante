<!-- =========================================================================
     TUESTANTE ADMIN - COMPONENTE REUTILIZABLE NAVBAR (BARRA SUPERIOR)
     ========================================================================= -->
<header id="admin-navbar" class="admin-navbar" role="banner">
  <!-- Sección Izquierda: Botón Hamburguesa (3 rayas) + Título Dinámico de Pantalla -->
  <div class="navbar-left">
    <!-- Botón Hamburguesa: visible cuando el drawer está colapsado/oculto o en móvil -->
    <button 
      type="button" 
      id="navbar-hamburger-btn" 
      class="navbar-hamburger-btn" 
      data-drawer-toggle="true" 
      aria-label="Mostrar u ocultar menú lateral"
      title="Mostrar menú lateral">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <!-- Título Dinámico de la Pantalla Actual -->
    <div class="navbar-title-container">
      <h1 class="navbar-screen-title" id="navbar-screen-title">Inicio</h1>
    </div>
  </div>

  <!-- Sección Derecha: Tasa BCV del día, Buscador, Notificaciones, Separador y Perfil -->
  <div class="navbar-right">
    
    <!-- Indicador de Tasa Oficial del Día (BCV en Caché) -->
    <div class="navbar-exchange-badge" id="navbar-exchange-badge" title="Tasa oficial BCV del día">
      <span class="exchange-dot"></span>
      <span class="exchange-text">BCV: <strong id="navbar-exchange-val">791,32 Bs/$</strong></span>
    </div>

    <!-- Buscador / Icono de búsqueda -->
    <div class="navbar-search-wrapper" id="navbar-search-wrapper">
      <button type="button" class="navbar-icon-btn navbar-search-btn" id="navbar-search-toggle" aria-label="Abrir buscador" title="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      
      <!-- Campo expandible de búsqueda -->
      <div class="navbar-search-expand" id="navbar-search-expand">
        <svg class="search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="search" 
          id="navbar-search-input" 
          class="navbar-search-input" 
          placeholder="Buscar pedidos, productos, clientes..." 
          aria-label="Buscar en el sistema">
        <button type="button" class="search-field-close" id="navbar-search-close" aria-label="Cerrar buscador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Botón de Notificaciones con Badge Contador (Rojo/Vibrante como en la captura) -->
    <div class="navbar-notif-wrapper">
      <a href="modules/notifications/notifications.html" class="navbar-icon-btn navbar-notif-btn" id="navbar-notif-btn" aria-label="Ver notificaciones" title="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="navbar-badge" id="navbar-notif-badge" aria-label="5 notificaciones pendientes">5</span>
      </a>
    </div>

    <!-- Separador Vertical Sutil -->
    <div class="navbar-divider" aria-hidden="true"></div>

    <!-- Perfil de Usuario con Menú Desplegable -->
    <div class="navbar-user-dropdown" id="navbar-user-dropdown">
      <button 
        type="button" 
        class="navbar-user-btn" 
        id="navbar-user-btn" 
        aria-expanded="false" 
        aria-haspopup="true" 
        aria-label="Opciones de perfil de usuario">
        
        <!-- Avatar Circular -->
        <div class="navbar-avatar" id="navbar-user-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <!-- Meta de Usuario (Nombre + Email) -->
        <div class="navbar-user-meta">
          <span class="navbar-user-name" id="navbar-user-name">Administrador</span>
          <span class="navbar-user-email" id="navbar-user-email">admin@tienda.com</span>
        </div>

        <!-- Flecha Chevron de Despliegue -->
        <svg class="navbar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Menú Desplegable Flotante -->
      <div class="navbar-dropdown-card" id="navbar-dropdown-menu" role="menu" aria-label="Opciones de cuenta">
        <div class="dropdown-card-header">
          <span class="dropdown-tag">Sesión Activa</span>
          <strong class="dropdown-name" id="dropdown-user-name">Administrador</strong>
          <span class="dropdown-email" id="dropdown-user-email">admin@tienda.com</span>
        </div>
        
        <div class="dropdown-card-links">
          <a href="modules/settings/profile.html" class="dropdown-card-item" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Mi Perfil</span>
          </a>
          <a href="modules/settings/settings.html" class="dropdown-card-item" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Configuración</span>
          </a>
        </div>

        <div class="dropdown-card-footer">
          <button type="button" class="dropdown-card-item logout-link" id="navbar-logout-btn" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</header>

</body>
