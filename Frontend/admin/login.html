<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | TuEstante Admin</title>
  <meta name="description" content="Portal de autenticación exclusivo para personal administrativo de TuEstante.">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos del Login Admin -->
  <link rel="stylesheet" href="login.css">
</head>
<body class="admin-login-body">

  <!-- Fondo Decorativo con Luces Ambientales -->
  <div class="admin-login-ambient">
    <div class="glow-orb orb-primary"></div>
    <div class="glow-orb orb-accent"></div>
  </div>

  <main class="admin-login-wrapper">
    <div class="admin-login-card">
      
      <!-- Cabecera de la Tarjeta -->
      <div class="login-card-header">
        <div class="brand-badge">
          <span class="badge-shield-icon">🛡️</span>
          <span>Panel de Gestión y Control</span>
        </div>
        
        <div class="login-logo-container">
          <img src="assets/images/logo.jpeg" alt="TuEstante Logo" class="login-logo-img">
        </div>

        <h1 class="login-title">TuEstante Admin</h1>
        <p class="login-subtitle">Acceso restringido únicamente a usuarios con rol administrativo y personal autorizado.</p>
      </div>

      <!-- Banner de Notificación de Errores / Denegación de Acceso -->
      <div id="admin-login-error" class="login-alert-banner alert-danger hidden" role="alert">
        <div class="alert-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="alert-text" id="admin-login-error-text">Credenciales inválidas o permisos insuficientes.</div>
      </div>

      <!-- Banner de Notificación de Éxito -->
      <div id="admin-login-success" class="login-alert-banner alert-success hidden" role="status">
        <div class="alert-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="alert-text" id="admin-login-success-text">Acceso verificado. Redirigiendo al panel...</div>
      </div>

      <!-- Formulario de Autenticación -->
      <form id="admin-login-form" class="login-form" novalidate autocomplete="off">
        
        <!-- Campo: Usuario / Correo -->
        <div class="form-group">
          <label for="admin-username" class="form-label">Usuario o Correo Electrónico</label>
          <div class="input-container">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="admin-username" 
              name="username" 
              class="form-input" 
              placeholder="admin@tienda.com o usuario_admin" 
              required 
              autofocus
            >
          </div>
          <span class="field-error-text" id="error-username"></span>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <div class="label-row">
            <label for="admin-password" class="form-label">Contraseña de Administrador</label>
          </div>
          <div class="input-container">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="admin-password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••••••" 
              required
            >
            <button type="button" class="btn-toggle-password" id="btn-toggle-password" title="Mostrar u ocultar contraseña" aria-label="Alternar visibilidad">
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="field-error-text" id="error-password"></span>
        </div>

        <!-- Botón de Ingreso -->
        <button type="submit" class="btn-login-submit" id="btn-login-submit">
          <span class="btn-text">Ingresar al Panel de Control</span>
          <div class="spinner-loader hidden" id="login-spinner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
              <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
              <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
          </div>
        </button>

      </form>

      <!-- Pie del Login: Enlace a Tienda / Catálogo -->
      <div class="login-card-footer">
        <a href="../cliente/index.html" class="link-back-store">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Ir a la Tienda de Clientes</span>
        </a>
      </div>

    </div>
  </main>

  <!-- Script del Login -->
  <script type="module" src="login.js"></script>
</body>
</html>
