<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Distribuidor | TuEstante Admin</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../../index.css">
	<link rel="stylesheet" href="../../components/drawer/drawer.css">
	<link rel="stylesheet" href="../../components/navbar/navbar.css">
	<link rel="stylesheet" href="../../components/footer/footer.css">
	<link rel="stylesheet" href="distributor.css">
</head>
<body data-page-title="Detalle de Distribuidor">
	<div class="app-layout" id="app-layout">
		<div id="drawer-placeholder"></div>
		<div id="navbar-placeholder"></div>
		<main class="app-main-content">
			<div class="distributor-page">
				<!-- 1. Encabezado de Pantalla Estándar -->
				<section class="screen-header-card">
					<div class="screen-header-text">
						<div class="header-back-link">
							<a href="shipping.html" class="back-link" id="link-back-shipping">
								<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
									<line x1="19" y1="12" x2="5" y2="12"></line>
									<polyline points="12 19 5 12 12 5"></polyline>
								</svg>
								<span>Volver a Envíos</span>
							</a>
						</div>
						<h2 class="screen-main-title" id="page-title">Distribuidor</h2>
						<p class="screen-main-desc" id="page-subtitle">Información y cobertura registrada.</p>
					</div>
					<div class="header-actions">
						<a class="btn btn-outline" href="shipping.html" id="btn-back">Volver</a>
						<button type="button" class="btn btn-outline" id="toggle-edit">
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
								<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
							</svg>
							<span>Habilitar edición</span>
						</button>
						<button type="button" class="btn btn-primary" id="save-distributor" disabled>
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
								<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
								<polyline points="17 21 17 13 7 13 7 21"></polyline>
								<polyline points="7 3 7 8 15 8"></polyline>
							</svg>
							<span>Guardar cambios</span>
						</button>
					</div>
				</section>

				<section class="dist-card">
					<h2>Información general</h2>
					<div class="dist-form-grid">
						<div class="dist-field">
							<label for="name">Nombre <span class="required-star">*</span></label>
							<input id="name" required maxlength="200">
						</div>
						<div class="dist-field">
							<label for="rif">RIF <span class="required-star">*</span></label>
							<input id="rif" required maxlength="20">
						</div>
						<div class="dist-field">
							<label for="phone">Teléfono</label>
							<input id="phone" type="tel" inputmode="tel" maxlength="20" placeholder="Ej. +584121234567">
						</div>
						<div class="dist-field">
							<label for="email">Correo</label>
							<input id="email" type="email">
						</div>
						<div class="dist-field">
							<label for="coverage_type">Tipo de cobertura <span class="required-star">*</span></label>
							<select id="coverage_type">
								<option value="national">Nacional</option>
								<option value="regional">Regional</option>
								<option value="local">Local</option>
							</select>
						</div>
						<div class="dist-field">
							<label for="is_active">Estado</label>
							<select id="is_active">
								<option value="true">Activo</option>
								<option value="false">Inactivo</option>
							</select>
						</div>
					</div>
					<p class="dist-status" id="status"></p>
				</section>

				<section class="dist-card">
					<div class="coverage-toolbar">
						<h2>Coberturas</h2>
						<button type="button" class="btn btn-outline" id="add-coverage">
							<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<line x1="12" y1="5" x2="12" y2="19"></line>
								<line x1="5" y1="12" x2="19" y2="12"></line>
							</svg>
							<span>Agregar zona</span>
						</button>
					</div>
					<div class="dist-table-wrap">
						<table class="dist-table">
							<thead>
								<tr>
									<th>Estado <span class="required-star">*</span></th>
									<th>Municipio</th>
									<th>Ciudad</th>
									<th>Días (mín-máx)</th>
									<th>Flete base ($)</th>
									<th>Estado</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody id="coverage-list"></tbody>
						</table>
					</div>
				</section>
			</div>
		</main>
		<div id="footer-placeholder"></div>
	</div>
	<script type="module" src="distributor-detail.js"></script>
</body>
</html>
