<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envíos y Despacho | TuEstante Admin</title>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos de Componentes (Drawer, Navbar, Footer) -->
  <link rel="stylesheet" href="../../components/drawer/drawer.css">
  <link rel="stylesheet" href="../../components/navbar/navbar.css">
  <link rel="stylesheet" href="../../components/footer/footer.css">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">

  <!-- Estilos Específicos del Módulo de Envíos -->
  <link rel="stylesheet" href="./shipping.css">
</head>
<body data-page-title="Envíos">

  <!-- ========================================================================
       SISTEMA DE NOTIFICACIONES TOAST (SIN ALERTS)
       ======================================================================== -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ======================================================================
       ESTRUCTURA PRINCIPAL DEL PANEL (APP-LAYOUT)
       ====================================================================== -->
  <div class="app-layout" id="app-layout">

    <!-- Placeholders para componentes reutilizables (Drawer, Navbar, Footer) -->
    <div id="drawer-placeholder"></div>
    <div id="navbar-placeholder"></div>

    <!-- ======================================================================
         CONTENIDO PRINCIPAL: MÓDULO DE ENVÍOS
         ====================================================================== -->
    <main class="app-main-content">
      <div class="shipping-container">

        <!-- Encabezado de la Pantalla y Botones de Acción -->
        <section class="screen-header-card">
          <div class="screen-header-text">
            <h2 class="screen-main-title">Envíos</h2>
            <p class="screen-main-desc">
              Gestiona y da seguimiento a los envíos de los pedidos.
            </p>
          </div>
          <div class="screen-header-actions">
            <button type="button" class="btn btn-outline" id="btn-open-distributors-modal" title="Gestionar empresas transportadoras">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
              </svg>
              <span>Transportadores</span>
            </button>
            <button type="button" class="btn btn-primary" id="btn-open-new-shipment-modal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Registrar envío</span>
            </button>
          </div>
        </section>

        <!-- KPIs de Envíos -->
        <section class="shipping-kpi-grid" aria-label="Métricas de envíos" id="shipping-kpi-section">
          <!-- Generado dinámicamente -->
        </section>

        <!-- Tabla de Envíos -->
        <section class="shipping-table-card">
          <div class="table-responsive">
            <table class="data-table" id="table-shipments">
              <thead>
                <tr>
                  <th>Nº Envío</th>
                  <th>Pedido</th>
                  <th>Cliente</th>
                  <th>Transportador</th>
                  <th>Estado</th>
                  <th>Fecha</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tbody-shipments">
                <tr>
                  <td colspan="7" style="text-align:center; padding: 40px; color: #64748b;">
                    Cargando envíos...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

      </div>
    </main>

    <div id="footer-placeholder"></div>

  </div>

  <!-- Scripts Modulares -->
  <script type="module" src="./shipping.js"></script>
</body>
</html>
