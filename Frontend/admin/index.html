<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | TuEstante Admin</title>
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos de Componentes (Drawer, Navbar y Footer) -->
  <link rel="stylesheet" href="components/drawer/drawer.css">
  <link rel="stylesheet" href="components/navbar/navbar.css">
  <link rel="stylesheet" href="components/footer/footer.css">
  
  <!-- Estilos Globales del Dashboard -->
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="app-layout" id="app-layout">
    
    <!-- Placeholders para componentes reutilizables (Drawer, Navbar, Footer) -->
    <div id="drawer-placeholder"></div>
    <div id="navbar-placeholder"></div>

    <!-- ======================================================================
         CONTENIDO PRINCIPAL DINÁMICO DEL DASHBOARD
         ====================================================================== -->
    <main class="app-main-content">
      <div class="dashboard-container">
        
        <!-- 1. FILA SUPERIOR: 6 TARJETAS DE MÉTRICAS KPI -->
        <section class="kpi-metrics-grid" id="kpi-metrics-container" aria-label="Métricas clave de pedidos y estados">
          <!-- Renderizado dinámico desde index.js -->
        </section>

        <!-- 2. SECCIÓN INFERIOR ADAPTADA: GRÁFICO DONUT Y TABLA DE PEDIDOS -->
        <div class="dashboard-bottom-grid">
          
          <!-- Tarjeta Izquierda: Pedidos por Estado (Donut Chart) -->
          <section class="donut-card" aria-label="Distribución de pedidos por estado">
            <h2 class="card-title">Pedidos por estado</h2>
            
            <div class="donut-chart-section">
              <div class="donut-svg-container">
                <svg class="donut-svg" id="donut-svg-element" viewBox="0 0 190 190" aria-label="Gráfico circular de pedidos por estado"></svg>
                <div class="donut-center-info">
                  <span class="donut-center-count" id="donut-center-count">0</span>
                  <span class="donut-center-label">Total</span>
                </div>
              </div>
            </div>

            <ul class="donut-legend-list" id="donut-legend-container" role="list">
              <!-- Renderizado dinámico desde index.js -->
            </ul>
          </section>

          <!-- Tarjeta Derecha Adaptada: Pedidos Recientes (Tabla Completa) -->
          <section class="recent-orders-card" aria-label="Listado de pedidos recientes">
            <div>
              <div class="card-header-flex">
                <h2 class="card-title">Pedidos recientes</h2>
                <a href="modules/order/orders.html" class="card-header-link" title="Ver lista completa de pedidos">Ver todos</a>
              </div>

              <div class="table-responsive">
                <table class="orders-table" aria-label="Tabla de pedidos recientes">
                  <thead>
                    <tr>
                      <th scope="col">Pedido</th>
                      <th scope="col">Cliente</th>
                      <th scope="col">Total</th>
                      <th scope="col">Estado</th>
                      <th scope="col">Fecha</th>
                      <th scope="col" class="order-actions-col"><span class="sr-only"></span></th>
                    </tr>
                  </thead>
                  <tbody id="recent-orders-tbody">
                    <!-- Renderizado dinámico desde index.js -->
                  </tbody>
                </table>
              </div>
            </div>

            <div class="card-footer-action">
              <a href="modules/order/orders.html" class="footer-all-orders-link" title="Ver todos los pedidos">
                <span>Ver todos los pedidos</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
            </div>
          </section>

        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

  </div>

  <!-- ========================================================================
       MODAL DE VISTA RÁPIDA DE PEDIDO
       ======================================================================== -->
  <div id="quick-view-modal-backdrop" class="quick-view-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-order-title">
    <div class="quick-view-modal" role="document">
      <div class="modal-header">
        <h3 id="modal-order-title">Detalle del Pedido</h3>
        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Cerrar modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-row">
          <span class="modal-row-label">Código:</span>
          <span class="modal-row-value" id="modal-order-code"></span>
        </div>
        <div class="modal-row">
          <span class="modal-row-label">Cliente:</span>
          <span class="modal-row-value" id="modal-client-name"></span>
        </div>
        <div class="modal-row">
          <span class="modal-row-label">Email:</span>
          <span class="modal-row-value" id="modal-client-email"></span>
        </div>
        <div class="modal-row">
          <span class="modal-row-label">Monto Total:</span>
          <span class="modal-row-value" id="modal-order-total"></span>
        </div>
        <div class="modal-row">
          <span class="modal-row-label">Estado Actual:</span>
          <span class="modal-row-value" id="modal-order-status"></span>
        </div>
        <div class="modal-row">
          <span class="modal-row-label">Fecha y Hora:</span>
          <span class="modal-row-value" id="modal-order-date"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="modal-cancel-btn" style="padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); cursor: pointer; font-family: inherit; font-weight: 600;">Cerrar</button>
        <a href="modules/order/orders.html" class="btn btn-primary" id="modal-manage-order-link" style="padding: 8px 16px; border-radius: 8px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 600;">Gestionar Pedido</a>
      </div>
    </div>
  </div>

  <!-- Scripts: Inicialización Unificada del Dashboard -->
  <script type="module" src="index.js"></script>
</body>
</html>
